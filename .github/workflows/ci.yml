name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# O job só lê o código: o GITHUB_TOKEN não precisa de escrita.
permissions:
  contents: read

# Um push novo no mesmo PR cancela o run anterior, que ficou obsoleto. Na main
# nada é cancelado: cada commit mergeado continua com o próprio resultado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 é o default do Render para serviços Python novos (o agent consome
        # este pacote in-process lá), 3.10 é o mínimo do requires-python.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest + coverage)
        run: pytest -q --cov=vetflow_mcp --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
