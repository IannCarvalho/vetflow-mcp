[project]
name = "vetflow-mcp"
version = "0.1.0"
description = "Servidor MCP que expõe o backend do VetFlow (SaaS veterinário) como ferramentas para LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Iann Barbosa" }]
keywords = ["mcp", "model-context-protocol", "vetflow", "veterinary", "llm"]

dependencies = [
    # SDK oficial do Model Context Protocol (API 2.x: MCPServer).
    "mcp>=2.3.0",
    # Cliente HTTP assíncrono para falar com o backend Go.
    "httpx>=0.27.0",
    # Carrega VETFLOW_* de um .env em desenvolvimento.
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",   # mock de httpx nos testes
    "ruff>=0.6.0",
]

[project.scripts]
# Permite rodar o servidor como `vetflow-mcp` depois de instalar.
vetflow-mcp = "vetflow_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# A tabela é `tool.hatch` (não `tool.hatchling`): o nome errado era ignorado em
# silêncio e o pacote só entrava no wheel pela autodetecção do src layout.
[tool.hatch.build.targets.wheel]
packages = ["src/vetflow_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Mesmo ruleset do vetflow-agent, para os dois repositórios seguirem o mesmo padrão.
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Testes podem usar asserts e credenciais fake.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["vetflow_mcp"]

[tool.coverage.report]
show_missing = true
